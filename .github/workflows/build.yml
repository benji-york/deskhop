name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Install build deps
      shell: bash
      run: |
        sudo apt-get install -y \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          dosfstools

    - name: Checkout
      uses: actions/checkout@v4

    - name: Render webconfig
      shell: bash
      working-directory: webconfig
      run: make
    
    - name: Build disk image
      shell: bash
      working-directory: disk
      run: ./create.sh

    - name: Run native tests
      shell: bash
      run: |
        cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
          -Isrc/include \
          tests/test_zoom_tracker.c src/zoom_tracker.c \
          -o /tmp/deskhop-zoom-tracker-test
        /tmp/deskhop-zoom-tracker-test
        cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
          -Isrc/include \
          tests/test_fw_update.c src/fw_update.c \
          -o /tmp/deskhop-fw-update-test
        /tmp/deskhop-fw-update-test
        cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
          -Isrc/include \
          tests/test_screensaver_policy.c src/screensaver_policy.c \
          -o /tmp/deskhop-screensaver-policy-test
        /tmp/deskhop-screensaver-policy-test
        cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
          -Isrc/include \
          tests/test_reboot_hotkey.c src/reboot_hotkey.c \
          -o /tmp/deskhop-reboot-hotkey-test
        /tmp/deskhop-reboot-hotkey-test

    - name: Build firmware
      shell: bash
      run: |
        cmake -S . -B build
        cmake --build build

    - name: Publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deskhop-gha-${{ github.run_number }}
        path: build/deskhop.uf2
